schema_version: 1

# Reviewer-only probes. They verify access to the registered physical source;
# they do not calculate a business metric or replace an attribution query.
source_probes:
  - id: xuanji-registered-monitor-source-probe
    chains: [download, install]
    source_tables:
      - tap_dw.ads_dmg_quality_platform_download_chain_monitor_1d
    parameters: [business_date, game_type]
    sql: |
      SELECT
        ${business_date} AS probe_date,
        ${game_type} AS game_type,
        COUNT(1) AS source_row_count
      FROM tap_dw.ads_dmg_quality_platform_download_chain_monitor_1d
      WHERE dt = ${business_date}
        AND platform = 'ANDROID'
        AND game_type = ${game_type}

  - id: xuanji-download-attribution-source-probe
    chains: [download]
    source_tables:
      - tap_dw.ads_report_store_platform_device_game_download_chain_attribution_1d
    parameters: [business_date, game_type]
    sql: |
      SELECT
        ${business_date} AS probe_date,
        ${game_type} AS game_type,
        COUNT(1) AS source_row_count
      FROM tap_dw.ads_report_store_platform_device_game_download_chain_attribution_1d
      WHERE dt = ${business_date}
        AND platform = 'ANDROID'
        AND game_type = ${game_type}

  - id: xuanji-install-attribution-source-probe
    chains: [install]
    source_tables:
      - tap_dw.ads_report_store_platform_device_game_install_chain_attribution_1d
    parameters: [business_date, game_type]
    sql: |
      SELECT
        ${business_date} AS probe_date,
        ${game_type} AS game_type,
        COUNT(1) AS source_row_count
      FROM tap_dw.ads_report_store_platform_device_game_install_chain_attribution_1d
      WHERE dt = ${business_date}
        AND platform = 'ANDROID'
        AND game_type = ${game_type}

queries:
  - id: xuanji-registered-monitor-root
    chains: [download, install]
    dimensions: [root_metric]
    source_tables:
      - tap_dw.ads_dmg_quality_platform_download_chain_monitor_1d
    blocker_scope: root
    source_probe_id: xuanji-registered-monitor-source-probe

  - id: xuanji-download-game-attribution
    chains: [download]
    dimensions: [game_id]
    source_tables:
      - tap_dw.ads_report_store_platform_device_game_download_chain_attribution_1d
    blocker_scope: shared_attribution
    source_probe_id: xuanji-download-attribution-source-probe

  - id: xuanji-download-failed-rate-game-attribution
