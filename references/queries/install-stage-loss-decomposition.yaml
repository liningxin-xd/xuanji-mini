version: 2
id: xuanji-install-stage-loss-decomposition
domain: android-download-install
provider: taptap-data-query
database_type: MaxCompute
timezone: Asia/Shanghai
data_lag_days: 3
retention_days: 45
parameters:
  business_date: {type: date}
  game_type: {type: enum, allowed_values: [app, sandbox]}
# business_date is the mature download-complete cohort date. This QuerySpec
# runs after game_id attribution and never changes the official C / D metric.
sql: |
  WITH scoped_anchor_rows AS (
    SELECT
      dt,
      device_id,
      game_id,
      official_download_complete,
      official_install_complete,
      official_observation_days,
      has_client_install_start,
      diagnostic_event_matched,
      ROW_NUMBER() OVER (
        PARTITION BY dt, device_id, game_id
        ORDER BY device_id, game_id
      ) AS anchor_row_number
    FROM tap_dw.ads_report_store_platform_device_game_install_chain_attribution_1d
    WHERE dt BETWEEN TO_CHAR(
        DATEADD(TO_DATE(${business_date}), -7, 'dd'), 'yyyy-mm-dd'
      ) AND ${business_date}
      AND platform = 'ANDROID'
      AND game_type = ${game_type}
      AND is_metric_anchor = 1
  ), stage_summary AS (
    SELECT
      COUNT(DISTINCT CASE WHEN dt < ${business_date} THEN dt END)
        AS baseline_day_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
        THEN official_download_complete ELSE 0 END), 0) AS current_download_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
        THEN official_download_complete ELSE 0 END), 0) AS baseline_download_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
        THEN 1 ELSE 0 END), 0) AS current_start_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
        THEN 1 ELSE 0 END), 0) AS baseline_start_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
        THEN official_install_complete ELSE 0 END), 0) AS current_complete_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
        THEN official_install_complete ELSE 0 END), 0) AS baseline_complete_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
            AND official_install_complete = 0
        THEN 1 ELSE 0 END), 0) AS current_started_not_complete_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
            AND official_install_complete = 0
        THEN 1 ELSE 0 END), 0) AS baseline_started_not_complete_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND official_install_complete = 1
            AND COALESCE(has_client_install_start, 0) <> 1
        THEN 1 ELSE 0 END), 0) AS current_complete_without_start_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND official_install_complete = 1
            AND COALESCE(has_client_install_start, 0) <> 1
        THEN 1 ELSE 0 END), 0) AS baseline_complete_without_start_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND has_client_install_start = 1
            AND COALESCE(official_download_complete, 0) <> 1
        THEN 1 ELSE 0 END), 0) AS current_start_without_download_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND has_client_install_start = 1
            AND COALESCE(official_download_complete, 0) <> 1
        THEN 1 ELSE 0 END), 0) AS baseline_start_without_download_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
            AND COALESCE(diagnostic_event_matched, 0) <> 1
        THEN 1 ELSE 0 END), 0) AS current_start_without_event_match_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
            AND COALESCE(diagnostic_event_matched, 0) <> 1
        THEN 1 ELSE 0 END), 0) AS baseline_start_without_event_match_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND (
              official_download_complete IS NULL
              OR official_download_complete NOT IN (0, 1)
              OR official_install_complete IS NULL
              OR official_install_complete NOT IN (0, 1)
              OR official_install_complete > official_download_complete
            )
        THEN 1 ELSE 0 END), 0) AS current_invalid_metric_row_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND (
              official_download_complete IS NULL
              OR official_download_complete NOT IN (0, 1)
              OR official_install_complete IS NULL
              OR official_install_complete NOT IN (0, 1)
              OR official_install_complete > official_download_complete
            )
        THEN 1 ELSE 0 END), 0) AS baseline_invalid_metric_row_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND official_download_complete = 1
            AND (
              has_client_install_start IS NULL
              OR has_client_install_start NOT IN (0, 1)
            )
        THEN 1 ELSE 0 END), 0) AS current_invalid_start_row_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND official_download_complete = 1
            AND (
              has_client_install_start IS NULL
              OR has_client_install_start NOT IN (0, 1)
            )
        THEN 1 ELSE 0 END), 0) AS baseline_invalid_start_row_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
            AND (
              diagnostic_event_matched IS NULL
              OR diagnostic_event_matched NOT IN (0, 1)
            )
        THEN 1 ELSE 0 END), 0) AS current_invalid_event_match_row_count,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND official_download_complete = 1
            AND has_client_install_start = 1
            AND (
              diagnostic_event_matched IS NULL
              OR diagnostic_event_matched NOT IN (0, 1)
            )
        THEN 1 ELSE 0 END), 0) AS baseline_invalid_event_match_row_count,
      COALESCE(SUM(CASE WHEN dt = ${business_date}
            AND anchor_row_number > 1 THEN 1 ELSE 0 END), 0)
        AS current_anchor_duplicate_excess,
      COALESCE(SUM(CASE WHEN dt < ${business_date}
            AND anchor_row_number > 1 THEN 1 ELSE 0 END), 0)
        AS baseline_anchor_duplicate_excess,
      MIN(CASE WHEN dt = ${business_date}
            AND official_download_complete = 1
        THEN official_observation_days END) AS current_observation_days_min,
      MAX(CASE WHEN dt = ${business_date}
            AND official_download_complete = 1
        THEN official_observation_days END) AS current_observation_days_max,
      MIN(CASE WHEN dt < ${business_date}
            AND official_download_complete = 1
        THEN official_observation_days END) AS baseline_observation_days_min,
      MAX(CASE WHEN dt < ${business_date}
            AND official_download_complete = 1
        THEN official_observation_days END) AS baseline_observation_days_max
    FROM scoped_anchor_rows
  )
  SELECT
    ${business_date} AS analysis_date,
    ${game_type} AS game_type,
    baseline_day_count,
    current_download_count,
    baseline_download_count,
    current_start_count,
    baseline_start_count,
    current_complete_count,
    baseline_complete_count,
    current_download_count - current_start_count
      AS current_no_observed_start_count,
    baseline_download_count - baseline_start_count
      AS baseline_no_observed_start_count,
    current_started_not_complete_count,
    baseline_started_not_complete_count,
    (current_download_count - current_start_count) * 1.0
      / NULLIF(current_download_count, 0) AS current_no_observed_start_rate,
    (baseline_download_count - baseline_start_count) * 1.0
      / NULLIF(baseline_download_count, 0) AS baseline_no_observed_start_rate,
    current_started_not_complete_count * 1.0
      / NULLIF(current_download_count, 0) AS current_started_not_complete_share,
    baseline_started_not_complete_count * 1.0
      / NULLIF(baseline_download_count, 0) AS baseline_started_not_complete_share,
    current_complete_count * 1.0 / NULLIF(current_start_count, 0)
      AS current_post_start_completion_rate,
    baseline_complete_count * 1.0 / NULLIF(baseline_start_count, 0)
      AS baseline_post_start_completion_rate,
    current_complete_without_start_count,
    baseline_complete_without_start_count,
    current_start_without_download_count,
    baseline_start_without_download_count,
    current_start_without_event_match_count,
    baseline_start_without_event_match_count,
    current_invalid_metric_row_count,
    baseline_invalid_metric_row_count,
    current_invalid_start_row_count,
    baseline_invalid_start_row_count,
    current_invalid_event_match_row_count,
    baseline_invalid_event_match_row_count,
    current_anchor_duplicate_excess,
    baseline_anchor_duplicate_excess,
    current_observation_days_min,
    current_observation_days_max,
    baseline_observation_days_min,
    baseline_observation_days_max
  FROM stage_summary
output:
  date_column: analysis_date
  dimensions: [game_type]
  columns:
    analysis_date: date
    game_type: string
    baseline_day_count: integer
    current_download_count: integer
    baseline_download_count: integer
    current_start_count: integer
    baseline_start_count: integer
    current_complete_count: integer
    baseline_complete_count: integer
    current_no_observed_start_count: integer
    baseline_no_observed_start_count: integer
    current_started_not_complete_count: integer
    baseline_started_not_complete_count: integer
    current_no_observed_start_rate: number
    baseline_no_observed_start_rate: number
    current_started_not_complete_share: number
    baseline_started_not_complete_share: number
    current_post_start_completion_rate: number
    baseline_post_start_completion_rate: number
    current_complete_without_start_count: integer
    baseline_complete_without_start_count: integer
    current_start_without_download_count: integer
    baseline_start_without_download_count: integer
    current_start_without_event_match_count: integer
    baseline_start_without_event_match_count: integer
    current_invalid_metric_row_count: integer
    baseline_invalid_metric_row_count: integer
    current_invalid_start_row_count: integer
    baseline_invalid_start_row_count: integer
    current_invalid_event_match_row_count: integer
    baseline_invalid_event_match_row_count: integer
    current_anchor_duplicate_excess: integer
    baseline_anchor_duplicate_excess: integer
    current_observation_days_min: integer
    current_observation_days_max: integer
    baseline_observation_days_min: integer
    baseline_observation_days_max: integer
datasets:
  - id: install_stage_loss_decomposition
    columns:
      - game_type
      - baseline_day_count
      - current_download_count
      - baseline_download_count
      - current_start_count
      - baseline_start_count
      - current_complete_count
      - baseline_complete_count
      - current_no_observed_start_count
      - baseline_no_observed_start_count
      - current_started_not_complete_count
      - baseline_started_not_complete_count
      - current_no_observed_start_rate
      - baseline_no_observed_start_rate
      - current_started_not_complete_share
      - baseline_started_not_complete_share
      - current_post_start_completion_rate
      - baseline_post_start_completion_rate
      - current_complete_without_start_count
      - baseline_complete_without_start_count
      - current_start_without_download_count
      - baseline_start_without_download_count
      - current_start_without_event_match_count
      - baseline_start_without_event_match_count
      - current_invalid_metric_row_count
      - baseline_invalid_metric_row_count
      - current_invalid_start_row_count
      - baseline_invalid_start_row_count
      - current_invalid_event_match_row_count
      - baseline_invalid_event_match_row_count
      - current_anchor_duplicate_excess
      - baseline_anchor_duplicate_excess
      - current_observation_days_min
      - current_observation_days_max
      - baseline_observation_days_min
      - baseline_observation_days_max
    row_key: [game_type]
quality:
  require_non_empty: true
  unique_by: [analysis_date, game_type]
  max_rows: 1
  ranges:
    baseline_day_count: {min: 0, max: 7, allow_null: false}
    current_download_count: {min: 0, allow_null: false}
    baseline_download_count: {min: 0, allow_null: false}
    current_start_count: {min: 0, allow_null: false}
    baseline_start_count: {min: 0, allow_null: false}
    current_complete_count: {min: 0, allow_null: false}
    baseline_complete_count: {min: 0, allow_null: false}
    current_no_observed_start_count: {min: 0, allow_null: false}
    baseline_no_observed_start_count: {min: 0, allow_null: false}
    current_started_not_complete_count: {min: 0, allow_null: false}
    baseline_started_not_complete_count: {min: 0, allow_null: false}
    current_no_observed_start_rate: {min: 0, max: 1, allow_null: true}
    baseline_no_observed_start_rate: {min: 0, max: 1, allow_null: true}
    current_started_not_complete_share: {min: 0, max: 1, allow_null: true}
    baseline_started_not_complete_share: {min: 0, max: 1, allow_null: true}
    current_post_start_completion_rate: {min: 0, max: 1, allow_null: true}
    baseline_post_start_completion_rate: {min: 0, max: 1, allow_null: true}
    current_complete_without_start_count: {min: 0, allow_null: false}
    baseline_complete_without_start_count: {min: 0, allow_null: false}
    current_start_without_download_count: {min: 0, allow_null: false}
    baseline_start_without_download_count: {min: 0, allow_null: false}
    current_start_without_event_match_count: {min: 0, allow_null: false}
    baseline_start_without_event_match_count: {min: 0, allow_null: false}
    current_invalid_metric_row_count: {min: 0, allow_null: false}
    baseline_invalid_metric_row_count: {min: 0, allow_null: false}
    current_invalid_start_row_count: {min: 0, allow_null: false}
    baseline_invalid_start_row_count: {min: 0, allow_null: false}
    current_invalid_event_match_row_count: {min: 0, allow_null: false}
    baseline_invalid_event_match_row_count: {min: 0, allow_null: false}
    current_anchor_duplicate_excess: {min: 0, allow_null: false}
    baseline_anchor_duplicate_excess: {min: 0, allow_null: false}
    current_observation_days_min: {min: 1, max: 3, allow_null: true}
    current_observation_days_max: {min: 1, max: 3, allow_null: true}
    baseline_observation_days_min: {min: 1, max: 3, allow_null: true}
    baseline_observation_days_max: {min: 1, max: 3, allow_null: true}
