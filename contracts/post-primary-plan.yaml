version: 1

plans:
  post_primary_v1:
    max_additional_queries: 6
    enhancement_priority_plan: direction_enhancement_v1
    steps:
      - id: counterfactual
        kind: deterministic
        max_queries: 0
      - id: secondary
        kind: query
        max_queries: 1
      - id: game_background
        kind: query
        max_queries: 3
        selection:
          dominant_counterfactual_max_games: 1
          cumulative_root_adverse_ratio: 0.50
          max_games: 3
      - id: breadth_check
        kind: deterministic
        max_queries: 0
        selection:
          eligible_dimensions:
            - channel_group
            - device_brand
            - os_major_version
          minimum_other_buckets: 2
          minimum_relative_rate_change: 0.50
          max_focus_candidates_per_family: 3
          max_supporting_buckets: 2
      - id: error_code
        kind: query
        max_queries: 1
      - id: cross_dimension_overlap
        kind: query
        max_queries: 1
        selection:
          left_dimension: game_id
          right_dimension: is_reserve_auto_download
          minimum_candidate_adverse_impact: 0.0005
          root_adverse_ratio: 0.25
          marginal_rehook_tolerance: 0.000001
          quadrants: [BOTH, LEFT_ONLY, RIGHT_ONLY, NEITHER]
