name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TAPTAP_DATA_ANALYSIS_SKILL_ROOT: ${{ vars.TAPTAP_DATA_ANALYSIS_SKILL_ROOT }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m compileall host_integration host_service runtime tests
      - run: python -m unittest discover -s tests -v
      - run: python -m runtime.runner verify-assets
      - run: python scripts/primary_v1_deployment.py verify --allow-template-image
      - name: Verify compiled metric definitions
        if: env.TAPTAP_DATA_ANALYSIS_SKILL_ROOT != ''
        run: python scripts/compile_metric_definitions.py --check

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python tests/container_smoke.py
