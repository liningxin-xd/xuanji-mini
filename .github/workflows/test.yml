name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TAPTAP_DATA_ANALYSIS_SKILL_ROOT: ${{ vars.TAPTAP_DATA_ANALYSIS_SKILL_ROOT }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m compileall host_integration host_service runtime tests
      - run: python -m unittest discover -s tests -v
      - run: python -m runtime.runner verify-assets
      - run: python scripts/primary_v1_deployment.py verify --allow-template-image
      - run: python scripts/primary_v2_deployment.py verify --allow-template-image
      - run: >-
          python scripts/primary_v1_deployment.py render
          --image registry.example/xuanji-mini@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --host-public-url http://xuanji-primary-v1:8091
          --dview-mcp-url https://dview-mcp-public.tapsvc.com/mcp/query
          --output /tmp/xuanji-primary-v1.yaml
      - run: >-
          python scripts/primary_v2_deployment.py render
          --image registry.example/xuanji-mini@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --host-public-url http://xuanji-primary-v2:8091
          --dview-mcp-url https://dview-mcp-public.tapsvc.com/mcp/query
          --output /tmp/xuanji-primary-v2.yaml
      - name: Verify compiled metric definitions
        if: env.TAPTAP_DATA_ANALYSIS_SKILL_ROOT != ''
        run: python scripts/compile_metric_definitions.py --check

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        analysis-profile: [primary_v1, primary_v2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: >-
          python tests/container_smoke.py
          --analysis-profile ${{ matrix.analysis-profile }}
